<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>英语小游戏 · 访问测试</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f4f6ff; color: #202640; font: 18px/1.7 system-ui, sans-serif; }
    main { max-width: 560px; margin: 36px auto; padding: 28px; border-radius: 20px; background: white; }
    h1 { font-size: 1.6rem; line-height: 1.4; }
    .word { font-size: 2.5rem; margin: 16px 0; }
    audio { width: 100%; }
    li { margin-bottom: 12px; }
    .note { color: #505b74; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>页面已打开</h1>
    <p>这是英语小游戏的访问测试页，还不是正式游戏。</p>
    <ol>
      <li>关闭 VPN，在手机浏览器中打开本页。</li>
      <li>点击下面的播放按钮，确认能听到单词。</li>
      <li>把本页链接发到微信，再打开并播放一次。</li>
    </ol>
    <p class="word" lang="en">cat <span lang="zh-CN">· 小猫</span></p>
    <audio controls preload="none" aria-label="播放 cat 的英语发音">
      <source src="cat.wav" type="audio/wav">
      你的浏览器不支持这个音频播放器。
    </audio>
    <p class="note">如果没有声音，请检查媒体音量。请反馈：浏览器能否打开、微信能否打开、两处能否播放声音。</p>
    <p class="note">本页不要求登录，不使用麦克风，也没有表单或分析脚本。托管平台可能保留访问日志。一次测试成功不代表所有网络始终可用。</p>
  </main>
</body>
</html>
