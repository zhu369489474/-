  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f5ff;color:#232342;font:18px/1.65 system-ui,-apple-system,sans-serif}main{max-width:850px;margin:auto;padding:48px 22px}header{margin-bottom:30px}h1{margin:10px 0;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.3}header p{margin:0;color:#555773}.mark{font-size:48px}.versions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{display:flex;flex-direction:column;align-items:flex-start;background:white;padding:28px;border:2px solid #dedaf9;border-radius:24px;text-decoration:none;color:inherit;box-shadow:0 8px 0 #e5e1fb;transition:transform .15s}.card:hover{transform:translateY(-3px)}.card:focus-visible{outline:4px solid #5543cd;outline-offset:5px}.icon{font-size:42px}h2{font-size:1.6rem;margin:8px 0}ul{padding-left:22px;margin:0 0 26px}li{margin:8px 0}.go{margin-top:auto;display:inline-block;padding:12px 22px;border-radius:14px;background:#5543cd;color:white;font-weight:700}.plus{border-color:#f0ce65;box-shadow:0 8px 0 #f5e5ad}.plus .go{background:#ffdb70;color:#332b13}.note{font-size:1rem;color:#555773;margin-top:32px}footer{margin-top:24px;color:#555773;font-size:.9rem}@media(max-width:580px){main{padding-top:26px}.versions{grid-template-columns:1fr}.card{padding:24px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}

<body>
  <main>
    <header><span class="mark" aria-hidden="true">🦆</span><h1>小鸭英语乐园</h1><p>选一个版本，一起听一听、说一说。</p></header>
    <nav class="versions" aria-label="选择游戏版本">
      <a class="card" href="basic.html"><span class="icon" aria-hidden="true">🌱</span><h2>基础版</h2><ul><li>12 个入门单词</li><li>A–Z 字母点读</li><li>听声音，找图片</li></ul><span class="go">进入基础版 →</span></a>
